<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <section class="home" id="home">
        <nav>
            <div class="logo">
                <h1>Dine <span>With us</span></h1>
            </div>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="veg.html">Veg</a></li>
                <li><a href="non-veg.html">Non-Veg</a></li>
                <li><a href="ice-cream.html">Ice-Cream</a></li>
                <li><a href="milkshake.html">Milkshakes</a></li>
                <li><a href="juice.html">Juices</a></li>
                <li><a href="cake.html">Cakes</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="container">
            <div class="panel address">
                <div class="box box-1">
                    <i class="fa fa-address-card"></i>
                    <h1>Dine with us </h1>
                    <h2>286,ABC Street,</h2>
                    <h2>ABC City</h2>
                </div>
                <div class="box box-2">
                    <i class="fa fa-mobile"></i>
                    <h3>+92 3335 833487</h3>
                </div>
                <div class="box box-3">
                    <i class="fa fa-envelope"></i>
                    <h3>dine.withus@gmail.com</h3>
                </div>
                <div class="box box-4">
                    <i class="fa fa-globe"></i>
                    <h3>www.dine-with-us.com</h3>
                </div>
            </div>
            <div class="panel contact">
                <h3>Contact</h3>
                <div class="form-group">
                    <input type="text" id="txtName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <input type="text" id="numPhone" placeholder="Your Number">
                </div>
                <div class="form-group">
                    <input type="email" id="txtMail" placeholder="Your Mail id">

                <div>
                <div class="form-group">
                    <textarea name="message" id="txtMsg" cols="37" rows="4" placeholder="message"></textarea>
                </div>
                <div class="form-group">
                    <button class="btn-send">Send</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <h4>Copyright <i class="fa fa-copyright"></i> <spna class="ncolor">Dine With Us | All rights reserved</spna></h4>
            <h5>Made with <i class="fa fa-heart"></i> by <span class="ncolor">Code with Fatima</span></h5>
        </div>
    </section>
</body>
</html>
